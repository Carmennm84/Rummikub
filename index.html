<script>
const $=s=>document.querySelector(s);
let G,T={},uid=0,sid=0,DL=0,W={me:0,pc:0};
try{W=JSON.parse(localStorage.getItem("rk"))||W}catch(e){}
const mk=(c,n)=>{const t={id:uid++,c,n};T[t.id]=t;return t};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const IDX=t=>t.n?t.c*13+t.n-1:52,NUM=i=>i%13+1;
/* ---- reglas ---- */
function check(ts){
 const L=ts.length;if(L<3||L>13)return{ok:false,pts:0};
 const nj=ts.filter(t=>t.n),ns=nj.map(t=>t.n),cs=nj.map(t=>t.c);
 if(!nj.length)return{ok:false,pts:0};
 if(L<=4&&new Set(ns).size==1&&new Set(cs).size==nj.length)return{ok:true,pts:ns[0]*L};
 if(new Set(cs).size==1&&new Set(ns).size==nj.length){
  const mn=Math.min(...ns),mx=Math.max(...ns),lo=Math.max(1,mx-L+1),hi=Math.min(mn,14-L);
  if(lo<=hi){let p=0;for(let n=hi;n<hi+L;n++)p+=n;return{ok:true,pts:p,s:lo}}
 }
 return{ok:false,pts:0};
}
function arrange(ts){
 const r=check(ts);if(!r.ok||r.s==null)return ts;
 const js=ts.filter(t=>!t.n);
 return Array.from({length:ts.length},(_,p)=>ts.find(t=>t.n==r.s+p)||js.pop());
}
/* ---- IA difícil: búsqueda exacta con reorganización ---- */
const BASES=[];
for(let c=0;c<4;c++)for(let s=1;s<=11;s++)for(let e=s+2;e<=13;e++){const a=[];for(let n=s;n<=e;n++)a.push(c*13+n-1);BASES.push(a)}
for(let n=0;n<13;n++)for(let m=0;m<16;m++){const a=[0,1,2,3].filter(c=>m>>c&1);if(a.length>=3)BASES.push(a.map(c=>c*13+n))}
const mkBy=f=>{const y=Array.from({length:53},()=>[]);BASES.filter(f).forEach(b=>b.forEach(i=>y[i].push(b)));return y};
const BY=mkBy(()=>1),BYG=mkBy(b=>NUM(b[0])==NUM(b[1])),BYR=mkBy(b=>NUM(b[0])!=NUM(b[1]));let BS=BY;
function solve(tab,rack,melded){
 const t0=Date.now(),memo=new Map(),seen=new Set(),cnt=melded?1000:0;
 function use(b,req,opt){
  const o=opt.slice(),q=req&&req.slice(),miss=[],jp=[];let s=0;
  b.forEach((i,p)=>{if(q&&q[i]>0)q[i]--;else if(o[i]>0){o[i]--;s+=cnt+NUM(i)}else miss.push(p)});
  for(const p of miss){if(q&&q[52]>0)q[52]--;else if(o[52]>0){o[52]--;s+=cnt+NUM(b[p])}else return null;jp.push(p)}
  return{opt:o,req:q,s,jp,set:{b,jp}};
 }
 function best2(opt){
  const k=opt.join();if(memo.has(k))return memo.get(k);
  const i=opt.findIndex((v,j)=>j<52&&v>0);let res={s:0,sets:[]};
  if(i>=0&&Date.now()<DL){
   const o=opt.slice();o[i]--;res=best2(o);
   for(const b of BS[i]){const r=use(b,null,opt);if(r){const x=best2(r.opt);if(x.s+r.s>res.s)res={s:x.s+r.s,sets:[r.set,...x.sets]}}}
  }
  memo.set(k,res);return res;
 }
 let best=null;
 function p1(req,opt,sets,s){
  if(Date.now()>DL)return;
  const k=req.join()+"|"+opt.join();if(seen.has(k))return;seen.add(k);
  let i=req.findIndex((v,j)=>j<52&&v>0);if(i<0&&req[52]>0)i=52;
  if(i<0){const x=best2(opt);if(!best||s+x.s>best.s)best={s:s+x.s,sets:[...sets,...x.sets]};return}
  for(const b of(i==52?BASES:BY[i])){const r=use(b,req,opt);if(r&&(i<52||r.jp.length))p1(r.req,r.opt,[...sets,r.set],s+r.s)}
 }
 if(melded)p1(tab,rack,[],0);else best=best2(rack);
 return best;
}
function aiMove(b){
 const cnt=a=>{const c=Array(53).fill(0);a.forEach(t=>c[IDX(t)]++);return c};
 const tabT=G.sets.flatMap(s=>s.tiles);DL=Date.now()+900;
 const m=b.melded,r=solve(cnt(tabT),cnt(b.rack),m);
 if(!r||(m&&r.s<1000)||(!m&&r.s<30))return null;
 const PT=Array.from({length:53},()=>[]),PR=Array.from({length:53},()=>[]),used=[];
 (m?tabT:[]).forEach(t=>PT[IDX(t)].push(t));b.rack.forEach(t=>PR[IDX(t)].push(t));
 const take=i=>{if(PT[i].length)return PT[i].pop();const t=PR[i].pop();used.push(t);return t};
 const sets=r.sets.map(({b,jp})=>b.map((i,p)=>take(jp.includes(p)?52:i)));
 return{sets,used};
}
const zero=()=>Array(53).fill(0),cntOf=a=>{const c=zero();a.forEach(t=>c[IDX(t)]++);return c};
function gentle(tab,rk){
 const opts=tab.map(s=>{
  const ts=s.tiles,o=[{add:[]}];if(ts.some(t=>!t.n))return o;
  const ns=ts.map(t=>t.n),c=ts[0].c;
  if(new Set(ts.map(t=>t.c)).size==1){const mn=Math.min(...ns),mx=Math.max(...ns);
   for(let a=0;a<=Math.min(mn-1,3);a++)for(let z=0;z<=Math.min(13-mx,3);z++){if(!a&&!z)continue;const add=[];for(let k=1;k<=a;k++)add.push(c*13+mn-k-1);for(let k=1;k<=z;k++)add.push(c*13+mx+k-1);if(add.every(i=>rk[i]>0))o.push({add})}}
  else if(ts.length==3&&new Set(ns).size==1)for(let q=0;q<4;q++)if(!ts.some(t=>t.c==q)&&rk[q*13+ns[0]-1]>0)o.push({add:[q*13+ns[0]-1]});
  return o;
 });
 let best=null;
 function go(i,opt,adds,n){
  if(Date.now()>DL)return;
  if(i==opts.length){const x=solve(zero(),opt,1),tot=n*1000+(x?x.s:0);if(!best||tot>best.tot)best={tot,adds,sets:x?x.sets:[],n:n+(x?x.sets.reduce((q,s)=>q+s.b.length,0):0)};return}
  for(const o of opts[i])if(o.add.every(k=>opt[k]>0)){const o2=opt.slice();o.add.forEach(k=>o2[k]--);go(i+1,o2,[...adds,o.add],n+o.add.length)}
 }
 go(0,rk,[],0);return best;
}
function aiMove2(b){
 if(!b.melded){const r=aiMove(b);return r&&{used:r.used,fresh:new Set(r.used.map(t=>t.id)),re:0,sets:[...G.sets,...r.sets.map(a=>({id:sid++,tiles:arrange(a)}))]}}
 const rk=cntOf(b.rack),tabT=G.sets.flatMap(s=>s.tiles),used=[];
 DL=Date.now()+350;const gen=gentle(G.sets,rk);
 DL=Date.now()+600;const r=solve(cntOf(tabT),rk,1),fn=r&&r.s>=1000?Math.floor(r.s/1000):0,gn=gen?gen.n:0;
 const PR=Array.from({length:53},()=>[]),PT=Array.from({length:53},()=>[]);b.rack.forEach(t=>PR[IDX(t)].push(t));
 const take=i=>{if(PT[i].length)return PT[i].pop();const t=PR[i].pop();used.push(t);return t};
 if(gn>0&&fn<gn+(tabT.some(t=>!t.n)?1:3)){
  const sets=G.sets.map((s,i)=>{const a=gen.adds[i];return a.length?{id:s.id,tiles:arrange([...s.tiles,...a.map(take)])}:s});
  const nw=gen.sets.map(x=>({id:sid++,tiles:arrange(x.b.map((k,p)=>take(x.jp.includes(p)?52:k)))}));
  return{sets:[...sets,...nw],used,fresh:new Set(used.map(t=>t.id)),re:0};
 }
 if(!fn)return null;
 const vk=(bb,jp)=>bb.map((i,p)=>jp.includes(p)?52:i).sort((x,y)=>x-y).join(),nv=r.sets.map(x=>({...x,k:vk(x.b,x.jp)}));
 const slots=G.sets.map(s=>{const k=s.tiles.map(IDX).sort((x,y)=>x-y).join(),j=nv.findIndex(x=>x.k==k);if(j>=0){nv.splice(j,1);return s}return null});
 const kept=new Set(slots.filter(Boolean).flatMap(s=>s.tiles.map(t=>t.id)));
 tabT.filter(t=>!kept.has(t.id)).forEach(t=>PT[IDX(t)].push(t));
 const mk2=x=>({id:sid++,tiles:arrange(x.b.map((i,p)=>take(x.jp.includes(p)?52:i)))});
 const out=slots.map(s=>s||(nv.length?mk2(nv.shift()):null)).filter(Boolean);nv.forEach(x=>out.push(mk2(x)));
 return{sets:out,used,fresh:new Set(out.filter(s=>!G.sets.includes(s)).flatMap(s=>s.tiles.map(t=>t.id))),re:1};
}
function buzz(n){
 try{if(navigator.vibrate){navigator.vibrate(n>1?[50,60,50]:25);return}
  const l=document.createElement("label"),i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");l.style.cssText="position:fixed;left:-99px;top:-99px;opacity:0";l.append(i);document.body.append(l);
  l.click();if(n>1)setTimeout(()=>l.click(),110);setTimeout(()=>l.remove(),400)}catch(e){}
}
const COL=["#d9a7ff","#7ec8ff","#ffb36b"];let DRG=0;let S={played:0,won:0,pts:0,streak:0,chal:0};try{S={...S,...JSON.parse(localStorage.getItem("rk2"))}}catch(e){}
function statLine(){return S.played?"Ganadas "+S.won+" de "+S.played+" · Puntos "+S.pts+(S.chal?" · Retos "+S.chal:""):""}
function celebrate(){
 const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;z-index:100;pointer-events:none";document.body.append(c);
 const x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight,P=[],cols=["#d3392e","#1c5ec2","#e08419","#f3c552","#7fe3ac","#ffffff","#ff8fb8"];
 const burst=(bx,by)=>{const k=cols[Math.random()*7|0];for(let i=0;i<70;i++){const a=Math.random()*6.28,s=1.5+Math.random()*5;P.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.06,l:1,d:.011,r:2+Math.random()*2,c:Math.random()<.7?k:cols[Math.random()*7|0],f:0})}};
 for(let i=0;i<150;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.7,vx:Math.random()*2-1,vy:2+Math.random()*3,g:.02,l:1,d:.002,w:6+Math.random()*6,h:8+Math.random()*8,a:Math.random()*6,va:Math.random()*.3-.15,c:cols[Math.random()*7|0],f:1});
 const t0=Date.now();let nb=0;
 (function loop(){
  const t=Date.now()-t0;
  if(t>nb*650&&nb<7){burst(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4));nb++}
  x.clearRect(0,0,W,H);
  P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;if(p.f){p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}else{x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()}});
  if(t<6000)requestAnimationFrame(loop);else c.remove();

}
let NET=null,NETEND=0;
function initTiles(){uid=0;T={};for(let k=0;k<2;k++)for(let c=0;c<4;c++)for(let n=1;n<=13;n++)mk(c,n);mk(4,0);mk(4,0)}

function real(sets,rack){const PR=Array.from({length:53},()=>[]);rack.forEach(t=>PR[IDX(t)].push(t));return{out:sets.map(({b,jp})=>arrange(b.map((i,p)=>PR[jp.includes(p)?52:i].pop()))),left:PR.flat()}}
function run(bs,rk){const c=Array(53).fill(0);rk.forEach(t=>c[IDX(t)]++);DL=Date.now()+600;BS=bs;const r=solve(Array(53).fill(0),c,G.melded.me?1:0);BS=BY;return r&&r.sets.length?real(r.sets,rk):{out:[],left:rk}}
$("#sort").onclick=()=>{
 G.mode=(G.mode+1)%2;G.sort=G.mode?"num":"color";G.brk=new Set();G.sel.clear();let sets=[],left=G.rack.slice();
 {const a=run(G.mode?BYG:BYR,left);sets=a.out;left=a.left}
 G.rack=left;sortRack();left=G.rack;G.rack=[...sets.flat(),...left];
 let n=0;sets.forEach(s=>{if(n)G.brk.add(s[0].id);n+=s[0]?s.length:0});if(left.length&&n)G.brk.add(left[0].id);

function rackDrop(tg,left,gap){const cl=t=>{let c=0;for(let i=0;i<G.rack.length;i++){if(i&&G.brk.has(G.rack[i].id))c++;if(G.rack[i]===t)return c}return-1},same=tg&&!gap&&G.sel.size&&[...G.sel].every(i=>cl(T[i])==cl(tg))&&!check(G.rack.filter(x=>cl(x)==cl(tg))).ok,start=tg&&(G.rack.indexOf(tg)==0||G.brk.has(tg.id)),sep=!tg||gap||(left&&!start);
 const ts=G.rack.filter(x=>G.sel.has(x.id));
 ts.forEach(x=>{if(G.brk.delete(x.id)){const n=G.rack.slice(G.rack.indexOf(x)+1).find(y=>!G.sel.has(y.id));if(n)G.brk.add(n.id)}});
 G.rack=G.rack.filter(x=>!G.sel.has(x.id));
 const at=tg?G.rack.indexOf(tg)+(left?0:1):G.rack.length;
 G.rack.splice(at,0,...ts);ts.forEach(x=>G.brk.delete(x.id));
 if(same){const s0=left?at:at-1,e0=s0+ts.length+1;for(let k=s0+1;k<e0;k++)G.brk.delete(G.rack[k].id);if(s0>0)G.brk.add(G.rack[s0].id);if(G.rack[e0])G.brk.add(G.rack[e0].id);return"Grupo separado."}
 if(sep){if(at>0)G.brk.add(ts[0].id);if(tg)G.brk.add(tg.id)}else if(left&&G.brk.delete(tg.id)&&at>0)G.brk.add(ts[0].id);
 return sep?"Grupo separado.":"Unida al grupo.";
}

function snd(k){
 if(MUTE)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();
  let t=AC.currentTime;(k=="soft"?[[[392,440,523,587,659][Math.random()*5|0],.22,"sine",.06]]:SND[k]||[]).forEach(([f,d,w,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}
}

function hint(){
 if(G.turn||G.over)return;
 const tab=G.snap.sets.flat().map(i=>T[i]),rk=G.snap.rack.map(i=>T[i]),m=G.melded.me;
 const c=a=>{const z=Array(53).fill(0);a.forEach(t=>z[IDX(t)]++);return z};
 DL=Date.now()+500;BS=BY;const r=solve(c(tab),c(rk),m);
 if(!r||(m&&r.s<1000)||(!m&&r.s<30)){G.fresh.clear();return render(m?"Pista: no veo ninguna jugada. Roba una ficha.":"Pista: todavía no llegas a 30 puntos con tus fichas. Roba una ficha.")}
 const PT=Array.from({length:53},()=>[]),PR=Array.from({length:53},()=>[]),used=[];
 (m?tab:[]).forEach(t=>PT[IDX(t)].push(t));rk.forEach(t=>PR[IDX(t)].push(t));
 const out=r.sets.map(({b,jp})=>b.map((i,p)=>{const k=jp.includes(p)?52:i;if(PT[k].length)return PT[k].pop();const t=PR[k].pop();used.push(t);return t}));
 const key=a=>a.map(IDX).sort((x,y)=>x-y).join(),ks=out.map(key);
 const re=m&&G.snap.sets.some(a=>{const j=ks.indexOf(key(a.map(q=>T[q])));if(j<0)return true;ks.splice(j,1);return false});
 G.sel.clear();G.fresh=new Set(used.map(t=>t.id));snd("tap");
 render("Pista: puedes colocar "+used.length+" ficha"+(used.length>1?"s":"")+" (resaltadas)"+(m?(re?", reorganizando la mesa":""):" y abrir con "+r.s+" puntos")+".");
}
